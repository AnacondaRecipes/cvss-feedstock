{% set version = "3.6" %}
{% set name = "cvss" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/RedHatProductSecurity/{{ name }}/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 240b60a8f3d9b371a4fb56cca4e627306b16c6f82a226ee305877bb91dd102ba

build:
  skip: true # [py<36]
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  entry_points:
    - cvss_calculator = cvss.cvss_calculator:main

requirements:
  host:
    - python
    - setuptools
    - wheel
    - pip
  run:
    - python

test:
  source_files:
    - tests
  imports:
    - cvss
  requires:
    - pip
  commands:
    - pip check
    - cvss_calculator --help
    - python tests/test_cvss2.py
    - python tests/test_cvss3.py
    - python tests/test_cvss4.py

about:
  home: https://github.com/RedHatProductSecurity/cvss
  license: LGPL-3.0-only
  license_file: LICENSE
  license_family: LGPL
  summary: CVSS2/3/4 library with interactive calculator for Python 2 and Python 3
  description: |
    CVSS (Common Vulnerability Scoring System) is an standardized method for
    rating the severity of security issues on a scale from 0 (no impact) to 10 (critical).
  doc_url: https://github.com/RedHatProductSecurity/cvss/blob/master/README.rst
  dev_url: https://github.com/RedHatProductSecurity/cvss

extra:
  recipe-maintainers:
    - thewchan